name: Qualitaetssicherung

# WANN LAEUFT WAS?
#  - Bei jedem Commit auf main: deterministische Szenarien (kostenlos,
#    ~5 Sekunden). Schlaegt etwas fehl, ist der Commit rot markiert.
#  - Jede Nacht 03:00 Berlin: zusaetzlich das Red-Team (Fable 5).
#  - Von Hand startbar ueber den Reiter "Actions" -> "Run workflow".
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 Berlin (Sommerzeit)
  workflow_dispatch:
    inputs:
      redteam:
        description: "Red-Team-Lauf erzwingen (kostet API-Guthaben)"
        type: boolean
        default: false

# GEAENDERT (Sonar-Befund L21-23): Grundrecht fuer ALLE Jobs ist nur
# noch Lesen. Schreibrechte gibt es gezielt dort, wo die Heilung sie
# braucht - siehe Job "redteam". Prinzip der minimalen Rechte.
permissions:
  contents: read

jobs:
  szenarien:
    name: Deterministische Szenarien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntaxpruefung aller Skripte
        run: |
          node --check sw.js
          node --check install.js
          for f in netlify/functions/*.mjs; do node --check "$f"; done

      - name: Szenarien ausfuehren
        run: node tests/run.js

      # AUDIT 31.07.: Servertests liefen bisher gar nicht mit - die
      # gesamte Serverlogik war vom taeglichen Lauf ausgenommen.
      - name: Servertests ausfuehren
        run: |
          for f in tests/server/*.test.mjs; do node "$f"; done

      # Gegenprobe: Ein gruener Test beweist erst dann etwas, wenn er rot
      # wird, sobald man die Reparatur zerstoert. Faellt das aus, ist die
      # Testsuite Zierde statt Sicherung.
      - name: Mutationstest (Gegenprobe)
        run: node tests/mutation.js

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: tests/berichte/

  redteam:
    name: Red-Team (Fable 5)
    needs: szenarien
    if: github.event_name == 'schedule' || inputs.redteam
    runs-on: ubuntu-latest
    # GEAENDERT (Sonar-Befund L21-23): Nur DIESER Job darf schreiben,
    # denn nur hier findet die Heilung statt (Branch + Pull Request).
    # Die Szenarien oben laufen bewusst ohne Schreibrechte.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Angriffs-Testfaelle erzeugen und ausfuehren
        id: rt
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tests/redteam.mjs --runden=2 --budget=8

      - name: Selbstheilung anwenden
        run: node tests/heilung.js

      - name: Berichte sichern (VOR dem Pull Request - danach ist das
          Arbeitsverzeichnis aufgeraeumt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-berichte
          path: tests/berichte/
          if-no-files-found: warn

      - name: Bericht ans Handy melden
        if: always()
        env:
          QA_TOKEN: ${{ secrets.QA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tests/melde.mjs --anlass=nacht

      - name: Reparaturvorschlag als Pull Request
        if: always()
        # GEAENDERT (Sonar-Befund L102): Fremde Action auf festen Commit
        # gepinnt statt auf verschiebbares Tag "@v6". Ein Tag kann vom
        # Autor (oder einem Angreifer) nachtraeglich umgehaengt werden -
        # ein Commit-Hash nicht. Der Hash entspricht Release v6.0.5.
        uses: peter-evans/create-pull-request@6d6857d36972b65feb161a90e484f2984215f83e  # v6.0.5
        with:
          branch: qa/selbstheilung
          title: "QA: Selbstheilung + Red-Team-Befunde"
          commit-message: "QA: Attrappen-Luecken geschlossen, Systemkarte synchronisiert"
          body: |
            Automatischer Lauf der Qualitaetssicherung.

            * `tests/berichte/redteam.json` enthaelt die Verdachtsfaelle
              des Red-Teams (Modell Fable 5).
            * `tests/berichte/letzter-lauf.json` enthaelt den vollen Bericht.
            * Selbstheilung hat nur Testinfrastruktur veraendert –
              **kein App-Code wurde automatisch geaendert.**

            Bitte Verdachtsfaelle sichten: echter Defekt -> Fix beauftragen;
            falsche Annahme -> Testfall verwerfen.
          delete-branch: true
