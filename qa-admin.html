<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QA-Postfach – Familien-Assistent</title>
<style>
  :root { --accent:#c4704b; --bg:#f7f1e6; --card:#fffdf8; --muted:#8a7f6f;
          --gruen:#3f7a35; --rot:#a33; --gelb:#b8860b; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:#3a3630; margin:0; padding:14px; }
  main { max-width:640px; margin:0 auto; }
  .karte { background:var(--card); border-radius:12px; padding:14px 16px;
    margin-bottom:12px; box-shadow:0 2px 10px rgba(120,100,70,.12); }
  h1 { color:#a85a38; font-size:1.25rem; margin:2px 0 10px; }
  h2 { font-size:1rem; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:.85rem; }
  input { padding:10px; border:1px solid #ccc; border-radius:8px;
    width:200px; max-width:58%; }
  button { padding:12px 16px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; font-weight:bold; cursor:pointer;
    font-size:1rem; }
  button.gross { display:block; width:100%; margin-top:10px;
    padding:16px; font-size:1.05rem; }
  button.gruen { background:var(--gruen); }
  button.grau { background:#8a7f6f; }
  button:disabled { opacity:.45; }
  .ampel { display:inline-block; padding:4px 12px; border-radius:20px;
    color:#fff; font-weight:bold; font-size:.9rem; }
  .a-gruen { background:var(--gruen); } .a-gelb { background:var(--gelb); }
  .a-rot { background:var(--rot); }
  .fall { border-left:4px solid var(--gelb); background:#faf6ee;
    padding:8px 10px; margin:8px 0; border-radius:6px; font-size:.92rem; }
  .fall.echt { border-left-color:var(--rot); }
  code { background:#eee6d8; padding:1px 5px; border-radius:5px;
    font-size:.85rem; word-break:break-all; }
  a { color:var(--accent); }
  .zeile { display:flex; justify-content:space-between; padding:3px 0;
    border-bottom:1px solid #eee6d8; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>🔧 QA-Postfach</h1>

  <div class="karte" id="loginKarte">
    <input type="password" id="tok" placeholder="Zugangs-Token">
    <button type="button" data-aktion="laden">Öffnen</button>
    <p class="muted">Derselbe Token wie im Feedback-Postfach
    (Netlify-Variable <code>ADMIN_TOKEN</code>). Wird auf diesem Gerät
    gemerkt.</p>
  </div>

  <div id="inhalt"></div>
</main>

<script src="/qa-admin.js"></script>
</body>
</html>
