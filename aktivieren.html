<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivierung</title>
<style>
  body { font-family:system-ui,sans-serif; display:flex; align-items:center;
         justify-content:center; min-height:100vh; margin:0;
         background:#f7f1e6; color:#3e3832; }
  .box { background:#fffdf8; border-radius:18px; padding:32px 28px;
         text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.12);
         max-width:380px; width:90%; }
  h1 { color:#7e9c6f; margin:0 0 12px; font-size:2rem; }
  p  { margin:0 0 24px; color:#94897a; }
  a  { display:block; background:#7e9c6f; color:#fff; border-radius:10px;
       padding:14px; font-size:1.1rem; font-weight:700; text-decoration:none; }
  a:hover { opacity:.88; }
</style>
</head>
<body>
<div class="box">
  <h1>&#10003; Aktiviert!</h1>
  <p>Lifetime-Zugang wurde f&uuml;r dieses Ger&auml;t freigeschaltet.</p>
  <a href="/">Zur App &rarr;</a>
</div>
<script src="/aktivieren.js"></script>
</body>
</html>
