# Netlify-Konfiguration fuer den Familien-Assistenten

[functions]
  directory = "netlify/functions"

# Schoene Adressen /api/... auf die Funktionen umleiten
[[redirects]]
  from = "/api/rezept"
  to = "/.netlify/functions/rezept"
  status = 200
  force = true
  # F-033: Kostenschutz - hoechstens 12 Anfragen pro Minute und Besucher-Adresse
  # (Netlify zaehlt am Rand des Netzes; wir speichern dafuer nichts). Das
  # Tageslimit pro Geraet bleibt zusaetzlich bestehen.
  [redirects.rate_limit]
    window_limit = 12
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/termin-parse"
  to = "/.netlify/functions/termin-parse"
  status = 200

[[redirects]]
  from = "/api/termine"
  to = "/.netlify/functions/termine"
  status = 200

[[redirects]]
  from = "/api/vapid"
  to = "/.netlify/functions/vapid"
  status = 200

[[redirects]]
  from = "/api/push-anmelden"
  to = "/.netlify/functions/push-anmelden"
  status = 200

[[redirects]]
  from = "/api/wecker"
  to = "/.netlify/functions/wecker"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200


[[redirects]]
  from = "/api/qa"
  to = "/.netlify/functions/qa"
  status = 200

# Zeitgeber: prueft alle 5 Minuten, ob Wecksignale faellig sind
[functions."wecker-cron"]
  schedule = "*/5 * * * *"

# F-032: Schutz-Kopfzeilen fuer alle Seiten.
# Wichtigster Teil ist connect-src 'self': Die Seite darf nur mit sich selbst
# Verbindung aufnehmen - selbst bei einem Einbruch koennen so keine Daten an
# fremde Server abfliessen. 'unsafe-inline' ist uebergangsweise noetig, weil die
# App Skripte/Stile direkt in der Seite hat; 'wasm-unsafe-eval' brauchen der
# Scanner (Tesseract) und die lokale KI (WebAssembly). Kein 'unsafe-eval'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=(self), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=()"
    Cross-Origin-Opener-Policy = "same-origin"
